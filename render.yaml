services:
  - type: web
    name: befikr-stage-preview
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    disk:
      name: befikr-stage-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: BEFIKR_TOKEN_SECRET
        generateValue: true
      - key: BEFIKR_DATA_DIR
        value: /data
      - key: BEFIKR_MAPPING_PROVIDER
        value: demo
